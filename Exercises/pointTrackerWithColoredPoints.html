<!DOCTYPE html>
<html lang="en" onclick="captureClick(event);">
<head>
<meta charset="utf-8">
<meta name="author" content="Austin Ring">
<title>Point Tracker</title>

<style>
#pt1Graphic, #pt2Graphic {
    position: absolute;
    width: 8px;
    height: 8px;
}
</style>

<script src="pointTrackerWithColoredPoints.js"></script>
</head>

<body>
<h1>Point Tracker</h1>
<p>
Click your mouse anywhere on this web page to capture its location.
After capturing two locations, click the "Distance apart" button to
display their separation in pixels. Click again for additional points.
</p>

Point 1: <span id="pt1Location"></span>
<br>
Point 2: <span id="pt2Location"></span>
<br><br>

<input type="button" id="btn" value="Distance apart"
       onclick="displayDistance(event);">
<br><br>

<div id="message"></div>

<!-- Use CSS to display the following spaces as colored points -->
<span id="pt1Graphic" draggable="true" ondrag="dragPoint(event);"></span>
<span id="pt2Graphic" draggable="true" ondrag="dragPoint(event);"></span>

</body>
</html>
