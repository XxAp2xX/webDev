<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="author" content="Your Name">
    <title>Animal Alphabet</title>
    <link rel="icon" href="animalicon.png">
    <style>
        body {
            background-color: #fff9e6;
            font-family: "Comic Sans MS", cursive;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0b57a3;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            letter-spacing: 2px;
            font-size: 1.8em;
        }
        main {
            width: 90%;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border: 2px solid #cccccc;
        }
        #toplinks {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        #toplinks a {
            text-decoration: none;
            color: black;
            padding: 4px 10px;
        }
        #toplinks a:hover {
            background-color: rgb(233, 74, 135);
        }
        section {
            margin-bottom: 40px;
            padding: 15px;
            border: 2px solid #d3d3d3;
            background-color: #f7fcff;
        }
        section h2 {
            margin-top: 0;
            color: #0b57a3;
        }
        .animalRow {
            display: grid;
            grid-template-columns: 150px 200px 350px;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
        }
        .labelBox, .imageBox, .soundBox {
            border: 1px solid #999999;
            padding: 10px;
            background-color: #ffffff;
            text-align: center;
            min-height: 120px;
        }
        .labelBox {
            font-weight: bold;
            font-size: 1.2em;
        }
        .imageBox img {
            width: 150px;
            height: auto;
        }
        .soundBox img {
            width: 115px;
            height: auto;
        }
        footer {
            text-align: center;
            margin: 30px 0;
            font-size: 1.1em;
        }
        footer a {
            text-decoration: none;
            color: #0b57a3;
            font-weight: bold;
        }
        footer a:hover {
            color: red;
        }
    </style>
</head>
<body>

    <header id="pageTop">
        <h1>Animal Alphabet!</h1>
    </header>

    <main>
        <div id="toplinks">
            <a href="#A">A</a> |
            <a href="#B">B</a> |
            <a href="#C">C</a> |
            <a href="#D">D</a> |
            <a href="#E">E</a>
        </div>

        <section id="A">
            <h2>A is for Anteater!</h2>
            <div class="animalRow">
                <div class="labelBox">Anteater</div>
                <div class="imageBox">
                    <img src="anteater.jpg" alt="Anteater">
                </div>
                <div class="soundBox">
                    <audio controls>
                        <source src="anteater.mp3" type="audio/mpeg">
                        Your browser does not support audio.
                    </audio>
                </div>
            </div>
        </section>

        <section id="B">
            <h2>B is for Bear!</h2>
            <div class="animalRow">
                <div class="labelBox">Bear</div>
                <div class="imageBox">
                    <img src="bear.jpg" alt="Bear">
                </div>
                <div class="soundBox">
                    <img src="underconstruction.png" alt="Under Construction">
                </div>
            </div>
        </section>

        <section id="C">
            <h2>C is for Cat!</h2>
            <div class="animalRow">
                <div class="labelBox">Cat</div>
                <div class="imageBox">
                    <img src="cat.jpg" alt="Cat">
                </div>
                <div class="soundBox">
                    <img src="underconstruction.png" alt="Under Construction">
                </div>
            </div>
        </section>

        <section id="D">
            <h2>D is for Dog!</h2>
            <div class="animalRow">
                <div class="labelBox">Dog</div>
                <div class="imageBox">
                    <img src="dog.jpg" alt="Dog">
                </div>
                <div class="soundBox">
                    <img src="underconstruction.png" alt="Under Construction">
                </div>
            </div>
        </section>

        <section id="E">
            <h2>E is for Elephant!</h2>
            <div class="animalRow">
                <div class="labelBox">Elephant</div>
                <div class="imageBox">
                    <img src="elephant.jpg" alt="Elephant">
                </div>
                <div class="soundBox">
                    <img src="underconstruction.png" alt="Under Construction">
                </div>
            </div>
        </section>

        <footer>
            <a href="#pageTop">Back to Top of Page</a>
        </footer>
    </main>

</body>
</html>
