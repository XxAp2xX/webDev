<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Austin R">
        <title>Food Pyramid</title>
        <link rel="stylesheet" href="../library/microgrid.css">
        <style>
            h1 {text-align: center;}
            table {border-collapse: collapse; margin: 0 auto;}
            th, td {border: thin solid black; padding: 10px;}
            td:nth-of-type(2), td:nth-of-type(3) {text-align: center;}
            tr:first-of-type, tr:nth-of-type(2) {background-color: darkgreen; color: white;}
        </style>
    </head>
    <body>
        <table>
            <caption>
                <h1>USDA Food Pyramid</h1>
            </caption>
            <tr>
                <th colspan="2"></th><th colspan="2">Serving Guidelines</th>
            </tr>
            <tr>
                <th colspan="2">Food Group</th><th>2005-2010</th><th>2011-present</th>
            </tr>
            <tr>
                <td colspan="2"><b>Dairy</b><br><em>(milk, yogurt, cheese)</em></td><td>2-3</td><td>3-4</td>
            </tr>
            <tr>
                <td colspan="2"><b>Meat and Beans</b><br><em>(beef, pultry, fish, beans)</em></td><td>2-3</td><td>5-6</td>
            </tr>
            <tr>
                <td colspan="2"><b>Fruits</b></td><td>2-4</td><td>2-4</td>
            </tr>
            <tr>
                <td colspan="2"><b>Vegetables</b></td><td>3-5</td><td>1-2</td>
            </tr>
            <tr>
                <td colspan="2"><b>Grains</b><br><em>(bread, donuts, pop tarts)</em></td><td>1-2</td><td>3-5</td>
            </tr>
        </table>
    </body>
</html>
